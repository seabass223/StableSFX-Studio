[project]
name = "stablesfx-engine"
version = "0.1.0"
description = "Local Stable Audio 3 engine for StableSFX Studio (HTTP API + MCP server)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "stable-audio-3 @ git+https://github.com/Stability-AI/stable-audio-3@5866e5b415a2fedd36f3c0e47eb6f715fbc9b0fd",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "numpy>=2.2",
    "soundfile>=0.13.1",
    "pyloudnorm>=0.1.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "httpx>=0.27",
    "send2trash>=1.8.3",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
